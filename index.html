document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\n  font-family: 'Newsreader';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"04e34548-2e1b-4ac1-8ece-d4db75e21052\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* Newsreader — editorial serif, used sparingly for display headlines & pull quotes */\n  --font-serif-display: 'Newsreader', 'Iowan Old Style', 'Georgia', serif;\n\n  /* Manrope — geometric-humanist sans, the workhorse UI/body typeface */\n  --font-sans: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\n\n  /* IBM Plex Mono — code, data, numerals, technical labels */\n  --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;\n}\n<\u002Fstyle>\n<style>/* ==========================================================================\n   Stratal — Color tokens\n   Warm-neutral ink scale + a rust/terracotta primary (deliberately not the\n   default SaaS blue-purple). Base primitives first, semantic aliases below.\n   ========================================================================== */\n\n:root {\n  /* ---- Primitives: Ink (warm neutral, slightly toward brown, not blue-gray) ---- */\n  --ink-0: #FFFFFF;\n  --ink-25: #FBF9F6;\n  --ink-50: #F5F1EB;\n  --ink-100: #EBE4DA;\n  --ink-200: #D9CFC0;\n  --ink-300: #BFB1A0;\n  --ink-400: #998A78;\n  --ink-500: #766A5C;\n  --ink-600: #584F44;\n  --ink-700: #3F3931;\n  --ink-800: #292520;\n  --ink-900: #1B1815;\n  --ink-950: #100E0C;\n\n  /* ---- Primitives: Rust (primary brand color) ---- */\n  --rust-50: #FDF3EE;\n  --rust-100: #FAE1D3;\n  --rust-200: #F3BFA2;\n  --rust-300: #E9986D;\n  --rust-400: #DB7548;\n  --rust-500: #C1502E;\n  --rust-600: #A43E22;\n  --rust-700: #83301B;\n  --rust-800: #62260A;\n  --rust-900: #451C09;\n\n  /* ---- Primitives: Forest (secondary brand color) ---- */\n  --forest-50: #EEF3ED;\n  --forest-100: #D6E3D3;\n  --forest-200: #AFC9A9;\n  --forest-300: #83AB79;\n  --forest-400: #5C8C52;\n  --forest-500: #3E6E36;\n  --forest-600: #2F5233;\n  --forest-700: #253F27;\n  --forest-800: #1B2E1D;\n  --forest-900: #121F14;\n\n  /* ---- Primitives: Slate (info) ---- */\n  --slate-50: #EEF1F5;\n  --slate-100: #D6DDE6;\n  --slate-300: #93A3B8;\n  --slate-500: #4C617D;\n  --slate-700: #2E3D51;\n\n  /* ---- Primitives: Amber (warning) ---- */\n  --amber-50: #FCF3DD;\n  --amber-300: #EFC463;\n  --amber-500: #C89A2E;\n  --amber-700: #8A6A17;\n\n  /* ---- Primitives: Brick (danger) ---- */\n  --brick-50: #FBEAE7;\n  --brick-300: #E3958A;\n  --brick-500: #B8412E;\n  --brick-700: #7C2A1D;\n\n  /* ================= Semantic aliases ================= */\n\n  /* Surfaces */\n  --surface-page: var(--ink-25);\n  --surface-card: var(--ink-0);\n  --surface-sunken: var(--ink-50);\n  --surface-inverse: var(--ink-900);\n  --surface-overlay: rgba(27, 24, 21, 0.48);\n\n  /* Text */\n  --text-primary: var(--ink-900);\n  --text-secondary: var(--ink-600);\n  --text-tertiary: var(--ink-400);\n  --text-inverse: var(--ink-25);\n  --text-on-accent: var(--ink-0);\n  --text-link: var(--rust-600);\n  --text-link-hover: var(--rust-700);\n\n  /* Borders */\n  --border-subtle: var(--ink-100);\n  --border-default: var(--ink-200);\n  --border-strong: var(--ink-400);\n  --border-focus: var(--rust-500);\n\n  /* Brand / accent */\n  --color-primary: var(--rust-500);\n  --color-primary-hover: var(--rust-600);\n  --color-primary-active: var(--rust-700);\n  --color-primary-subtle: var(--rust-50);\n  --color-secondary: var(--forest-600);\n  --color-secondary-hover: var(--forest-700);\n  --color-secondary-subtle: var(--forest-50);\n\n  /* Semantic status */\n  --color-success: var(--forest-600);\n  --color-success-subtle: var(--forest-50);\n  --color-warning: var(--amber-500);\n  --color-warning-subtle: var(--amber-50);\n  --color-danger: var(--brick-500);\n  --color-danger-subtle: var(--brick-50);\n  --color-info: var(--slate-500);\n  --color-info-subtle: var(--slate-50);\n\n  /* Focus ring */\n  --focus-ring: 0 0 0 3px rgba(193, 80, 46, 0.28);\n}\n<\u002Fstyle>\n<style>/* ==========================================================================\n   Stratal — Typographic scale\n   Fluid-ish fixed scale (1.2 ratio-ish, hand-tuned). Display sizes pair with\n   --font-serif-display; everything UI/body uses --font-sans.\n   ========================================================================== */\n\n:root {\n  --text-xs: 12px;\n  --text-sm: 13px;\n  --text-base: 15px;\n  --text-md: 17px;\n  --text-lg: 20px;\n  --text-xl: 24px;\n  --text-2xl: 30px;\n  --text-3xl: 38px;\n  --text-4xl: 48px;\n  --text-5xl: 64px;\n  --text-6xl: 84px;\n\n  --leading-tight: 1.1;\n  --leading-snug: 1.3;\n  --leading-normal: 1.55;\n  --leading-relaxed: 1.7;\n\n  --tracking-tight: -0.02em;\n  --tracking-normal: 0;\n  --tracking-wide: 0.04em;\n  --tracking-wider: 0.12em;\n\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n  --weight-extrabold: 800;\n}\n<\u002Fstyle>\n<style>/* ==========================================================================\n   Stratal — Spacing, radius & layout tokens\n   4px base unit.\n   ========================================================================== */\n\n:root {\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n  --space-32: 128px;\n\n  --radius-sm: 4px;\n  --radius-md: 8px;\n  --radius-lg: 14px;\n  --radius-xl: 20px;\n  --radius-full: 999px;\n\n  --container-max: 1160px;\n  --container-narrow: 720px;\n}\n<\u002Fstyle>\n<style>/* ==========================================================================\n   Stratal — Shadows, motion & focus\n   Shadows are soft, warm-tinted (using ink-900 not pure black), low-spread —\n   never a harsh drop shadow. Motion is quick and purposeful, no bounce.\n   ========================================================================== */\n\n:root {\n  --shadow-xs: 0 1px 2px rgba(27, 24, 21, 0.06);\n  --shadow-sm: 0 1px 3px rgba(27, 24, 21, 0.08), 0 1px 2px rgba(27, 24, 21, 0.05);\n  --shadow-md: 0 4px 10px rgba(27, 24, 21, 0.08), 0 2px 4px rgba(27, 24, 21, 0.06);\n  --shadow-lg: 0 12px 24px rgba(27, 24, 21, 0.10), 0 4px 8px rgba(27, 24, 21, 0.06);\n  --shadow-xl: 0 24px 48px rgba(27, 24, 21, 0.14), 0 8px 16px rgba(27, 24, 21, 0.08);\n\n  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n  --ease-out: cubic-bezier(0, 0, 0.2, 1); /* @kind other */\n  --ease-in: cubic-bezier(0.4, 0, 1, 1); /* @kind other */\n\n  --duration-fast: 120ms; /* @kind other */\n  --duration-base: 180ms; /* @kind other */\n  --duration-slow: 280ms; /* @kind other */\n}\n<\u002Fstyle>\n<style>/* ==========================================================================\n   Stratal — Minimal base/reset, built on the tokens above.\n   ========================================================================== */\n\n* { box-sizing: border-box; }\n\nbody {\n  background: var(--surface-page);\n  color: var(--text-primary);\n  font-family: var(--font-sans);\n  font-size: var(--text-base);\n  line-height: var(--leading-normal);\n  -webkit-font-smoothing: antialiased;\n}\n\na {\n  color: var(--text-link);\n  text-decoration: none;\n}\na:hover {\n  color: var(--text-link-hover);\n  text-decoration: underline;\n}\n\n:focus-visible {\n  outline: none;\n  box-shadow: var(--focus-ring);\n  border-radius: var(--radius-sm);\n}\n<\u002Fstyle>\n<style>/* Stratal Design System — global stylesheet entry point.\n   This file is a manifest of @imports only; never add rules directly here. */\n\n/* ==========================================================================\n   Stratal — Web fonts\n   No brand font files were provided in the source repos (both were meta\n ', 'Iowan Old Style', 'Georgia', serif;\n\n  /* Manrope — geometric-humanist sans, the workhorse UI/body typeface */\n  --font-sans: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\n\n  /* IBM Plex Mono — code, data, numerals, technical labels */\n  --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;\n}\n\n/* ==========================================================================\n   Stratal — Color tokens\n   Warm-neutral ink scale + a rust/terracotta primary (deliberately not the\n   default SaaS blue-purple). Base primitives first, semantic aliases below.\n   ========================================================================== */\n\n:root {\n  /* ---- Primitives: Ink (warm neutral, slightly toward brown, not blue-gray) ---- */\n  --ink-0: #FFFFFF;\n  --ink-25: #FBF9F6;\n  --ink-50: #F5F1EB;\n  --ink-100: #EBE4DA;\n  --ink-200: #D9CFC0;\n  --ink-300: #BFB1A0;\n  --ink-400: #998A78;\n  --ink-500: #766A5C;\n  --ink-600: #584F44;\n  --ink-700: #3F3931;\n  --ink-800: #292520;\n  --ink-900: #1B1815;\n  --ink-950: #100E0C;\n\n  /* ---- Primitives: Rust (primary brand color) ---- */\n  --rust-50: #FDF3EE;\n  --rust-100: #FAE1D3;\n  --rust-200: #F3BFA2;\n  --rust-300: #E9986D;\n  --rust-400: #DB7548;\n  --rust-500: #C1502E;\n  --rust-600: #A43E22;\n  --rust-700: #83301B;\n  --rust-800: #62260A;\n  --rust-900: #451C09;\n\n  /* ---- Primitives: Forest (secondary brand color) ---- */\n  --forest-50: #EEF3ED;\n  --forest-100: #D6E3D3;\n  --forest-200: #AFC9A9;\n  --forest-300: #83AB79;\n  --forest-400: #5C8C52;\n  --forest-500: #3E6E36;\n  --forest-600: #2F5233;\n  --forest-700: #253F27;\n  --forest-800: #1B2E1D;\n  --forest-900: #121F14;\n\n  /* ---- Primitives: Slate (info) ---- */\n  --slate-50: #EEF1F5;\n  --slate-100: #D6DDE6;\n  --slate-300: #93A3B8;\n  --slate-500: #4C617D;\n  --slate-700: #2E3D51;\n\n  /* ---- Primitives: Amber (warning) ---- */\n  --amber-50: #FCF3DD;\n  --amber-300: #EFC463;\n  --amber-500: #C89A2E;\n  --amber-700: #8A6A17;\n\n  /* ---- Primitives: Brick (danger) ---- */\n  --brick-50: #FBEAE7;\n  --brick-300: #E3958A;\n  --brick-500: #B8412E;\n  --brick-700: #7C2A1D;\n\n  /* ================= Semantic aliases ================= */\n\n  /* Surfaces */\n  --surface-page: var(--ink-25);\n  --surface-card: var(--ink-0);\n  --surface-sunken: var(--ink-50);\n  --surface-inverse: var(--ink-900);\n  --surface-overlay: rgba(27, 24, 21, 0.48);\n\n  /* Text */\n  --text-primary: var(--ink-900);\n  --text-secondary: var(--ink-600);\n  --text-tertiary: var(--ink-400);\n  --text-inverse: var(--ink-25);\n  --text-on-accent: var(--ink-0);\n  --text-link: var(--rust-600);\n  --text-link-hover: var(--rust-700);\n\n  /* Borders */\n  --border-subtle: var(--ink-100);\n  --border-default: var(--ink-200);\n  --border-strong: var(--ink-400);\n  --border-focus: var(--rust-500);\n\n  /* Brand / accent */\n  --color-primary: var(--rust-500);\n  --color-primary-hover: var(--rust-600);\n  --color-primary-active: var(--rust-700);\n  --color-primary-subtle: var(--rust-50);\n  --color-secondary: var(--forest-600);\n  --color-secondary-hover: var(--forest-700);\n  --color-secondary-subtle: var(--forest-50);\n\n  /* Semantic status */\n  --color-success: var(--forest-600);\n  --color-success-subtle: var(--forest-50);\n  --color-warning: var(--amber-500);\n  --color-warning-subtle: var(--amber-50);\n  --color-danger: var(--brick-500);\n  --color-danger-subtle: var(--brick-50);\n  --color-info: var(--slate-500);\n  --color-info-subtle: var(--slate-50);\n\n  /* Focus ring */\n  --focus-ring: 0 0 0 3px rgba(193, 80, 46, 0.28);\n}\n\n/* ==========================================================================\n   Stratal — Typographic scale\n   Fluid-ish fixed scale (1.2 ratio-ish, hand-tuned). Display sizes pair with\n   --font-serif-display; everything UI/body uses --font-sans.\n   ========================================================================== */\n\n:root {\n  --text-xs: 12px;\n  --text-sm: 13px;\n  --text-base: 15px;\n  --text-md: 17px;\n  --text-lg: 20px;\n  --text-xl: 24px;\n  --text-2xl: 30px;\n  --text-3xl: 38px;\n  --text-4xl: 48px;\n  --text-5xl: 64px;\n  --text-6xl: 84px;\n\n  --leading-tight: 1.1;\n  --leading-snug: 1.3;\n  --leading-normal: 1.55;\n  --leading-relaxed: 1.7;\n\n  --tracking-tight: -0.02em;\n  --tracking-normal: 0;\n  --tracking-wide: 0.04em;\n  --tracking-wider: 0.12em;\n\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n  --weight-extrabold: 800;\n}\n\n/* ==========================================================================\n   Stratal — Spacing, radius & layout tokens\n   4px base unit.\n   ========================================================================== */\n\n:root {\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n  --space-32: 128px;\n\n  --radius-sm: 4px;\n  --radius-md: 8px;\n  --radius-lg: 14px;\n  --radius-xl: 20px;\n  --radius-full: 999px;\n\n  --container-max: 1160px;\n  --container-narrow: 720px;\n}\n\n/* ==========================================================================\n   Stratal — Shadows, motion & focus\n   Shadows are soft, warm-tinted (using ink-900 not pure black), low-spread —\n   never a harsh drop shadow. Motion is quick and purposeful, no bounce.\n   ========================================================================== */\n\n:root {\n  --shadow-xs: 0 1px 2px rgba(27, 24, 21, 0.06);\n  --shadow-sm: 0 1px 3px rgba(27, 24, 21, 0.08), 0 1px 2px rgba(27, 24, 21, 0.05);\n  --shadow-md: 0 4px 10px rgba(27, 24, 21, 0.08), 0 2px 4px rgba(27, 24, 21, 0.06);\n  --shadow-lg: 0 12px 24px rgba(27, 24, 21, 0.10), 0 4px 8px rgba(27, 24, 21, 0.06);\n  --shadow-xl: 0 24px 48px rgba(27, 24, 21, 0.14), 0 8px 16px rgba(27, 24, 21, 0.08);\n\n  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n  --ease-out: cubic-bezier(0, 0, 0.2, 1); /* @kind other */\n  --ease-in: cubic-bezier(0.4, 0, 1, 1); /* @kind other */\n\n  --duration-fast: 120ms; /* @kind other */\n  --duration-base: 180ms; /* @kind other */\n  --duration-slow: 280ms; /* @kind other */\n}\n\n/* ==========================================================================\n   Stratal — Minimal base/reset, built on the tokens above.\n   ========================================================================== */\n\n* { box-sizing: border-box; }\n\nbody {\n  background: var(--surface-page);\n  color: var(--text-primary);\n  font-family: var(--font-sans);\n  font-size: var(--text-base);\n  line-height: var(--leading-normal);\n  -webkit-font-smoothing: antialiased;\n}\n\na {\n  color: var(--text-link);\n  text-decoration: none;\n}\na:hover {\n  color: var(--text-link-hover);\n  text-decoration: underline;\n}\n\n:focus-visible {\n  outline: none;\n  box-shadow: var(--focus-ring);\n  border-radius: var(--radius-sm);\n}\n\n<\u002Fstyle>\n<script src=\"f49e1495-c8ab-44de-9bae-ecea5d3f26e4\"><\u002Fscript>\n<script src=\"213d1a1d-62eb-42f7-af0c-3cae06c1a0da\" integrity=\"sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i\" crossorigin=\"anonymous\"><\u002Fscript>\n<script src=\"11a032af-1874-4109-9ad9-4682d2b47baf\"><\u002Fscript>\n<script src=\"5b1d755f-0466-477a-bb33-096e9b025ead\" integrity=\"sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67\" crossorigin=\"anonymous\"><\u002Fscript>\n<style>\nbody { margin: 0; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); }\na { color: var(--text-link); } a:hover { color: var(--text-link-hover); }\ntextarea:focus { outline: none; box-shadow: var(--focus-ring); }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height: 100vh; background: var(--surface-page); font-family: var(--font-sans); color: var(--text-primary);\">\n\n urface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-md);\">\n              <sc-if value=\"{{ p.met }}\"><img src=\"{{ p.face }}\" alt=\"\" style=\"width: 44px; height: 44px; flex: none; border-radius: 50%; border: 1px solid var(--border-subtle);\"><\u002Fsc-if>\n              <sc-if value=\"{{ p.notMet }}\"><div style=\"width: 44px; height: 44px; flex: none; border-radius: 50%; background: var(--surface-sunken); color: var(--text-tertiary); font-family: var(--font-serif-display); font-style: italic; font-size: 20px; display: flex; align-items: center; justify-content: center;\">?<\u002Fdiv><\u002Fsc-if>\n              <div style=\"display: flex; flex-direction: column; min-width: 0; flex: 1;\"><span style=\"font-weight: 600;\">{{ p.name }}<\u002Fspan><span style=\"font-size: var(--text-xs); color: var(--text-secondary);\">{{ p.role }}<\u002Fspan><\u002Fdiv>\n              <span style=\"font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary);\">{{ p.city }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ jPlaces }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n          <sc-for list=\"{{ places }}\" as=\"p\" hint-placeholder-count=\"6\">\n            <div style=\"padding: 14px; background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); display: flex; flex-direction: column; gap: 6px;\">\n              <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 8px;\">\n                <span style=\"font-weight: 600;\">{{ p.city }} <span style=\"font-weight: 400; color: var(--text-tertiary); font-size: var(--text-sm);\">{{ p.country }}<\u002Fspan><\u002Fspan>\n                <sc-if value=\"{{ p.done }}\"><span style=\"display: flex; gap: 2px;\"><sc-for list=\"{{ p.stars }}\" as=\"st\"><span style=\"width: 14px; height: 14px; background: {{ st.c }}; -webkit-mask: url(&quot;df76a9a6-49c5-4fd9-b5b5-c79a793b0056&quot;) center / contain no-repeat; mask: url(&quot;df76a9a6-49c5-4fd9-b5b5-c79a793b0056&quot;) center / contain no-repeat;\"><\u002Fspan><\u002Fsc-for><\u002Fspan><\u002Fsc-if>\n                <sc-if value=\"{{ p.notDone }}\"><span style=\"font-size: var(--text-xs); color: var(--text-tertiary);\">Not visited<\u002Fspan><\u002Fsc-if>\n              <\u002Fdiv>\n              <sc-if value=\"{{ p.done }}\"><div style=\"font-size: var(--text-sm); color: var(--text-secondary); line-height: var(--leading-normal);\">{{ p.recap }}<\u002Fdiv><\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ jClues }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n          <sc-if value=\"{{ noClues }}\"><div style=\"padding: 24px 0; color: var(--text-secondary);\">Nothing here yet. Finish your first station to find a clue.<\u002Fdiv><\u002Fsc-if>\n          <sc-for list=\"{{ clues }}\" as=\"c\" hint-placeholder-count=\"2\">\n            <div style=\"padding: 14px; background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); display: flex; flex-direction: column; gap: 6px;\">\n              <span style=\"font-family: var(--font-mono); font-size: 11px; letter-spacing: var(--tracking-wider); color: var(--text-tertiary);\">{{ c.city }}<\u002Fspan>\n              <span style=\"font-weight: 600; font-size: var(--text-sm);\">{{ c.clue }}<\u002Fspan>\n              <span style=\"font-family: var(--font-serif-display); font-style: italic; font-size: var(--text-lg); color: var(--rust-700);\">{{ c.frag }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ jEnglish }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n          <div style=\"font-size: var(--text-sm); color: var(--text-secondary);\">Every time you use a form correctly in the story, it counts here.<\u002Fdiv>\n          <sc-for list=\"{{ eng }}\" as=\"e\" hint-placeholder-count=\"6\">\n            <div style=\"display: grid; grid-template-columns: 20px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-md);\">\n              <span style=\"width: 18px; height: 18px; background: {{ e.c }}; -webkit-mask: url(&quot;9a321861-bf8d-4bd4-807f-9dad26716ec3&quot;) center / contain no-repeat; mask: url(&quot;9a321861-bf8d-4bd4-807f-9dad26716ec3&quot;) center / contain no-repeat;\"><\u002Fspan>\n              <span style=\"display: flex; flex-direction: column;\"><span style=\"font-weight: 600; font-size: var(--text-sm);\">{{ e.name }}<\u002Fspan><span style=\"font-size: var(--text-xs); color: var(--text-secondary);\">{{ e.cue }}<\u002Fspan><\u002Fspan>\n              <span style=\"font-family: var(--font-mono); font-size: var(--text-sm); color: var(--text-secondary);\">×{{ e.n }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border-subtle); display: flex; flex-wrap: wrap; gap: 8px; align-items: center;\">\n        <sc-if value=\"{{ confirmReset }}\" hint-placeholder-val=\"{{ false }}\">\n          <span style=\"font-size: var(--text-sm); color: var(--text-secondary); flex: 1 1 200px;\">Start over? Your progress will be lost.<\u002Fspan>\n          <x-import component-from-global-scope=\"StratalDesignSystem_6ecd58.Button\" variant=\"danger\" size=\"sm\" sc-camel-on-click=\"{{ onRestart }}\" hint-size=\"auto,32px\">Start over<\u002Fx-import>\n          <x-import component-from-global-scope=\"StratalDesignSystem_6ecd58.Button\" variant=\"ghost\" size=\"sm\" sc-camel-on-click=\"{{ cancelReset }}\" hint-size=\"auto,32px\">Cancel<\u002Fx-import>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ notConfirmReset }}\" hint-placeholder-val=\"{{ true }}\">\n          <x-import component-from-global-scope=\"StratalDesignSystem_6ecd58.Button\" variant=\"ghost\" size=\"sm\" sc-camel-on-click=\"{{ askReset }}\" hint-size=\"auto,32px\">Start a new journey<\u002Fx-import>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;hintMode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;adaptive&quot;,&quot;always&quot;,&quot;off&quot;],&quot;default&quot;:&quot;adaptive&quot;,&quot;tsType&quot;:&quot;'adaptive'|'always'|'off'&quot;,&quot;section&quot;:&quot;Learning&quot;},&quot;aiCheck&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Learning&quot;},&quot;showRu&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Learning&quot;}}\">\nclass Component extends DCLogic {\n  state = { screen: 'loading', D: null, P: null, geo: null, sel: null, travel: null, jOpen: false, jTab: 'people', text: '', busy: false, flip: false, lastDone: null, ftexts: ['', '', '', '', '', ''], confirmReset: false };\n  KEY = 'lostPassport.v1';\n  TK = ['ps', 'pc', 'pas', 'pac', 'pap', 'prp'];\n\n  componentDidMount() { this.boot(); this.onRs = () => this.setState({ vw: window.innerWidth }); window.addEventListener('resize', this.onRs); this.onRs(); }\n  componentWillUnmount() { cancelAnimationFrame(this.raf); window.removeEventListener('resize', this.onRs); }\n\n  async boot() {\n    let D;\n    try { for (let k = 0; !window.LP_DATA && k < 100; k++) await new Promise(r => setTimeout(r, 50)); D = win
